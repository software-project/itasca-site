# version: '3.8'

services:
  web:
    build: .
    container_name: itasca_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=itasca.settings.production
    volumes:
      - ./media:/home/ubuntu/www/itasca/media
      - ./static:/home/ubuntu/www/itasca/static
      # Remove the db.sqlite3 volume line
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    command: sh -c "npm run build:css && python manage.py collectstatic --noinput && gunicorn itasca.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-level debug --access-logfile - --error-logfile - --capture-output"

  db:
    image: postgres:17
    container_name: itasca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: itasca_db
      POSTGRES_USER: itasca_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Read from .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Optional: expose port for external access (not needed if only accessed from web container)
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  postgres_data: